[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-semantic-dedup-lab"
version = "1.0.0"
description = "Chunked semantic deduplication pipeline with CPU and optional GPU backends"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2", "pyarrow>=14"]
gpu = ["torch>=2.2", "cupy-cuda12x>=13", "triton>=2.2"]
nlp = ["sentence-transformers>=3"]

[project.scripts]
dedup-lab = "dedup_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dedup_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
